name: Bug report
description: A Hero Card, item or compendium entry doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before you file: please try reproducing the problem with **only** this module
        and the D&D 5e system enabled. Most odd behaviour turns out to be a conflict
        with another module, and knowing that up front saves a lot of back-and-forth.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and what you expected to happen instead.
      placeholder: |
        I played Luck on an attack roll made with advantage, but only one d20 was rerolled.
        I expected both dice to be rerolled.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact clicks needed to see the problem. Say which card you played and what kind of roll it was on (attack, damage, check, save or initiative), and whether it had advantage or disadvantage.
      placeholder: |
        1. Give a character the Hero Cards feature
        2. Target a goblin and make an attack roll with advantage
        3. Click Hero Card on the roll and choose Luck
        4. Only one d20 is rerolled
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      description: Which part of the module is involved? Pick the closest match.
      options:
        - Hero Card button on a chat roll
        - Card picker window
        - Inspiration (adding a die)
        - Luck, Indomitable or Relentless (rerolls)
        - Advantage (before or after the roll)
        - Card uses / long rest recovery
        - Compendium content (items, spells, journal)
        - Images or card art
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
      description: Found in the bottom-left of the Foundry setup screen, e.g. 14.362.
      placeholder: "14.362"
    validations:
      required: true

  - type: input
    id: system-version
    attributes:
      label: D&D 5e system version
      description: Shown in Game Settings → Support & Issues, e.g. 6.0.5.
      placeholder: "6.0.5"
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: Sogrom's Table Tools version
      description: Shown in the Manage Modules list next to the module name.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: >-
        Press F12 to open the developer tools, switch to the Console tab, reproduce the
        problem, then paste any red error text here. This is automatically formatted as
        code, so no backticks needed.
      render: text

  - type: textarea
    id: other-modules
    attributes:
      label: Other roll or chat modules in use
      description: >-
        Which other modules change rolls, chat cards or item use? midi-qol, Dice So Nice, Ready Set Roll,
        and so on. Other roll modules are a common cause of odd behaviour.
      placeholder: "midi-qol, Dice So Nice"

  - type: checkboxes
    id: isolated
    attributes:
      label: Confirmations
      options:
        - label: I reproduced this with only this module and the D&D 5e system enabled (plus any module needed to see it).
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
