  description:
    value: >-
      <p>Channeling the warmth and invigorating aroma of freshly brweed coffee,
      you conjure a magically energizing beverage. The recipient experiences
      heightened alertness, clarity and motivation as the comforting scent fills
      their senses. Until the spell ends, the affected creature can add 1d4 to
      their initiative rolls.</p><p><strong>Cantrip Upgrade. </strong>When you
      reach 5th level, you can choose one additional creature within 10 feet of
      you to recieve this benefit. At 11th level, you may choose two additional
      creatures, and at 17th level you may choose three additional
      creatures</p><div class="fvtt narrative"><p>"All things are possible, with
      enough coffee" - Theodore the Orange</p></div>
